<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin — AssignHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- Login -->
  <section class="login" id="loginView">
    <form class="card login-card" id="loginForm">
      <span class="logo"><span class="logo-mark">&lt;/&gt;</span> Admin</span>
      <h2>Welcome back 👋</h2>
      <p class="muted small">Enter your admin password to see incoming requests.</p>
      <input type="password" id="password" placeholder="Admin password" autocomplete="current-password" required>
      <div class="form-error" id="loginError"></div>
      <button class="btn btn-primary">Log in</button>
      <a href="/" class="muted small">← Back to website</a>
    </form>
  </section>

  <!-- Dashboard -->
  <div id="dashView" hidden>
    <header class="nav scrolled">
      <div class="container nav-inner">
        <a href="/" class="logo"><span class="logo-mark">&lt;/&gt;</span> Dashboard</a>
        <div class="nav-actions">
          <span class="muted small hide-sm" id="lastSync"></span>
          <button class="icon-btn" id="themeToggle" title="Toggle theme">🌙</button>
          <button class="btn btn-ghost btn-sm" id="refreshBtn">↻ Refresh</button>
          <button class="btn btn-ghost btn-sm" id="exportBtn">⬇ CSV</button>
          <button class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
        </div>
      </div>
    </header>

    <main class="container admin-main">
      <div class="kpis" id="kpis"></div>

      <div class="toolbar card">
        <input id="search" placeholder="🔍 Search name, task, subject, ID, phone…">
        <div class="chips" id="statusChips"></div>
        <select id="sortBy">
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
          <option value="deadline">Closest deadline</option>
        </select>
      </div>

      <div class="req-list" id="reqList"></div>
    </main>
  </div>

  <!-- Detail drawer -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-panel" id="drawerPanel"></div>
  </aside>

  <div class="toast" id="toast"></div>
  <script src="/admin.js"></script>
</body>
</html>
